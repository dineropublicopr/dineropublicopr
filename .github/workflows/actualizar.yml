name: Actualizar datos

# Domingos a las 23:00 UTC (7:00 PM en Puerto Rico). El portal de la Contralora recibe
# registros nuevos durante toda la semana, incluyendo contratos con fecha retroactiva, asi
# que el pipeline refresca los dos anos fiscales mas recientes en cada corrida.
on:
  schedule:
    - cron: "0 23 * * 0"
  workflow_dispatch:

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    # La ingesta se autolimita a una peticion cada 1.5s por respeto al servidor publico,
    # asi que una corrida completa toma su tiempo.
    timeout-minutes: 300

    # A nivel de job para que los pasos puedan preguntar por ellos en su `if`. El contexto
    # env de un paso no esta disponible en el condicional de ese mismo paso.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLAREDINERO }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Fijada a proposito. Antes decia `wrangler@4` y Cloudflare quito el subcomando
      # `d1 import` en una version menor, asi que la corrida del 2026-10-21 borro las
      # tablas y no pudo recargarlas. Subir esto a mano despues de probar el comando.
      WRANGLER_VERSION: "4.151.3"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Los JSONL crudos no van al repositorio (son cientos de MB), asi que se cachean
      # entre corridas. Sin esto, cada semana volveria a bajar cuatro anos completos.
      - name: Restaurar cache de datos crudos
        uses: actions/cache@v4
        with:
          path: data/raw
          key: contratos-raw-${{ github.run_id }}
          restore-keys: |
            contratos-raw-

      - name: Correr el pipeline
        run: python3 pipeline/run.py

      - name: Verificar que hay datos
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          resumen = pathlib.Path("web/datos/resumen.json")
          if not resumen.exists():
              sys.exit("no se genero resumen.json")
          data = json.loads(resumen.read_text(encoding="utf-8"))
          if (data.get("contratos") or 0) < 50_000:
              sys.exit(f"muy pocos contratos: {data.get('contratos')}")
          print(f"ok: {data['contratos']:,} contratos")
          PY

      # El push deja el historial de los datos en main, pero no publica nada: el proyecto
      # de Pages es de subida directa, asi que el despliegue va en el paso siguiente.
      - name: Publicar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/datos web/descargas
          if git diff --staged --quiet; then
            echo "sin cambios"
          else
            git commit -m "Actualizacion automatica de datos: $(date -u +%Y-%m-%d)"
            git push
          fi

      # Pages es de subida directa, asi que el sitio se publica desde aqui. Sin el token
      # configurado este paso se salta y el repositorio queda actualizado igual.
      - name: Desplegar el sitio en Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx --yes wrangler@${WRANGLER_VERSION} pages deploy web --project-name=dineropublicopr --branch=main --commit-dirty=true

      # El API consultable corre sobre D1, que no se actualiza con el despliegue del sitio.
      # Tambien se salta si no hay token.
      - name: Refrescar la base D1
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          # Se recrea desde cero: es mas simple y seguro que calcular diferencias, y la
          # base entera son ~100 MB.
          #
          # Los DROP van DENTRO del mismo archivo que el dump, no en un paso aparte. Si se
          # borran las tablas en una invocacion y la carga falla en la siguiente, la base
          # queda vacia y el API devuelve 500 "no such table" hasta que alguien lo arregle
          # a mano. Paso el 2026-10-21. Una sola invocacion, un solo punto de fallo.
          {
            echo 'DROP TABLE IF EXISTS contracts;'
            echo 'DROP TABLE IF EXISTS contractors;'
            echo 'DROP TABLE IF EXISTS entities;'
            echo 'DROP TABLE IF EXISTS meta;'

            # D1 rechaza BEGIN TRANSACTION, COMMIT y PRAGMA, que es justo lo que mete
            # `sqlite3 .dump`. Hay que quitar esas tres lineas o la carga falla entera.
            sqlite3 data/out/contratos.sqlite .dump \
              | grep -v -e '^PRAGMA foreign_keys=OFF;$' \
                        -e '^BEGIN TRANSACTION;$' \
                        -e '^COMMIT;$'
          } > /tmp/contratos_d1.sql

          # `wrangler d1 import` ya no existe: lo quitaron en una version de wrangler 4 y
          # la corrida del 2026-10-21 fallo con "Unknown arguments: import". El comando
          # vigente es `d1 execute --file`, que sube hasta 5 GiB por la misma via.
          npx --yes wrangler@${WRANGLER_VERSION} d1 execute dineropublicopr \
            --remote --yes --file=/tmp/contratos_d1.sql

      # Sin esto, una carga que falle a medias pasa desapercibida: el sitio estatico se ve
      # bien y solo el API queda roto. Se compara contra el JSON que acaba de generar el
      # pipeline, que es la fuente de verdad de esta corrida.
      - name: Verificar que el API responde con los datos nuevos
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          esperado=$(python3 -c "import json;print(json.load(open('web/datos/resumen.json'))['contratos'])")
          obtenido=$(curl -sS --retry 3 --retry-delay 10 \
            https://dineropublicopr.com/api/v1/resumen \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('contratos','ninguno'))")
          echo "sitio: $esperado | API: $obtenido"
          if [ "$esperado" != "$obtenido" ]; then
            echo "::error::D1 no quedo igual que el sitio. El API puede estar roto."
            exit 1
          fi
