name = "dineropublicopr"
compatibility_date = "2026-09-01"
pages_build_output_dir = "web"

# El API consultable vive en functions/api/v1/[[route]].js, en la raiz del proyecto y NO
# dentro de web/. Esto importa: wrangler busca el directorio `functions` en la raiz, no en
# el directorio de salida. Con el archivo en web/functions se subio como asset estatico,
# el worker nunca se compilo y /api/v1/ devolvia el index.html con HTTP 200.
# Queda publicado en dineropublicopr.com/api/v1/... sin subdominios.
#
# El proyecto de Pages es de SUBIDA DIRECTA, no esta conectado a git. Un push no publica
# nada; el despliegue lo hace `wrangler pages deploy` (a mano o desde el workflow).
#
# Publicar el sitio:
#
#   wrangler pages deploy web --project-name=dineropublicopr --branch=main
#
# Recargar la base D1 desde el SQLite local. OJO: el dump de sqlite3 no se puede importar
# tal cual, D1 rechaza BEGIN TRANSACTION, COMMIT y PRAGMA:
#
#   sqlite3 data/out/contratos.sqlite .dump \
#     | grep -v -e '^PRAGMA foreign_keys=OFF;$' -e '^BEGIN TRANSACTION;$' -e '^COMMIT;$' \
#     > /tmp/contratos_d1.sql
#   wrangler d1 import dineropublicopr --remote --file=/tmp/contratos_d1.sql
#
# Limites del plan gratuito de D1 a tener presentes: 500 MB por base y 5 millones de filas
# leidas por dia. Con ~270,000 contratos la base ronda los 100 MB, asi que cabe con holgura;
# si el proyecto crece a los 14 anos completos hay que revisarlo antes de importar.
#
# El binding tiene que llamarse DB, que es lo que busca la funcion.

[[d1_databases]]
binding = "DB"
database_name = "dineropublicopr"
database_id = "b9727f72-f90b-4d08-befa-e6069eb30f94"
